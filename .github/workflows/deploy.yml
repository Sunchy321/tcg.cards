name: Deploy

permissions:
  contents: write

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - name: Write DB env file
        run: echo "DATABASE_URL=$DATABASE_URL" > packages/db/.env.remote-prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Run database migrations
        run: bun --cwd packages/db run db:migrate:remote:prod

  detect:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.detect.outputs.sites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile

      - name: Detect affected sites
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');

            // Ensure deployed tag exists (first deployment)
            try {
              execSync('git rev-parse deployed', { stdio: 'ignore' });
            } catch {
              execSync('git tag deployed $(git rev-list --max-parents=0 HEAD)');
            }

            // Run turbo to detect affected packages
            let affected;
            try {
              const out = execSync(
                'bun x turbo run build --filter="...[deployed]" --dry-run=json',
                { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }
              );
              const data = JSON.parse(out);
              affected = data.packages || [];
            } catch {
              // If turbo fails, deploy everything
              affected = ['site-hearthstone', 'site-magic', 'site-main', '@tcg-cards/watcher', 'service-internal'];
            }

            core.info(`Affected packages: ${JSON.stringify(affected)}`);

            // Deployable sites and their deploy config
            const deployable = {
              'site-hearthstone':       { name: 'site-hearthstone', dir: 'apps/site-hearthstone', auth: 'https://hearthstone.tcg.cards' },
              'site-magic':             { name: 'site-magic', dir: 'apps/site-magic', auth: 'https://magic.tcg.cards' },
              'site-main':              { name: 'site-main', dir: 'apps/site-main', auth: 'https://tcg.cards' },
              '@tcg-cards/watcher':     { name: 'watcher', dir: 'apps/watcher', auth: '' },
              'service-internal':       { name: 'service-internal', dir: 'apps/service-internal', auth: '' },
            };

            const sites = affected
              .filter(pkg => deployable[pkg])
              .map(pkg => deployable[pkg]);

            // If no deployable sites affected, fall back to all
            const result = sites.length > 0 ? sites : Object.values(deployable);

            core.info(`Deploying: ${JSON.stringify(result)}`);
            core.setOutput('sites', JSON.stringify(result));

  build-and-deploy:
    needs: [migrate, detect]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: ${{ fromJson(needs.detect.outputs.sites) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile

      - name: Write .env.production
        run: |
          printf 'NODE_ENV=production\nBETTER_AUTH_SECRET=%s\nBETTER_AUTH_URL=%s\nASSET_BASE_URL=https://asset.tcg.cards\n' \
            "$BETTER_AUTH_SECRET" "$AUTH_URL" \
            > ${{ matrix.site.dir }}/.env.production
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          AUTH_URL: ${{ matrix.site.auth }}

      - name: Build
        run: bun --cwd ${{ matrix.site.dir }} run build

      - name: Deploy
        run: bun --cwd ${{ matrix.site.dir }} run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  tag:
    needs: [build-and-deploy]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update deployed tag
        run: |
          git tag -f deployed
          git push origin deployed -f
