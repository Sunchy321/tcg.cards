name: Deploy

permissions:
  contents: write

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Write DB env file
        run: echo "DATABASE_URL=$DATABASE_URL" > packages/db/.env.remote-prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Run database migrations
        working-directory: packages/db
        run: bun run db:migrate:remote:prod

  detect:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.detect.outputs.sites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile

      - name: Detect affected sites
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            // Deployable by naming convention: site-* are websites, service-* are headless
            // services. A wrangler.toml marks readiness; a top-level `deploy = false`
            // opts the app out of this deploy pipeline.
            function isDeployable(pkg) {
              if (!pkg.startsWith('site-') && !pkg.startsWith('service-')) return false;
              const tomlPath = `apps/${pkg}/wrangler.toml`;
              if (!fs.existsSync(tomlPath)) return false;
              const toml = fs.readFileSync(tomlPath, 'utf8');
              return !/^\s*deploy\s*=\s*false\s*$/m.test(toml);
            }

            // Ensure deployed tag exists (first deployment)
            try {
              execSync('git rev-parse deployed', { stdio: 'ignore' });
            } catch {
              execSync('git tag deployed $(git rev-list --max-parents=0 HEAD)');
            }

            // Run turbo to detect affected packages
            let affected;
            try {
              const out = execSync(
                'bun x turbo run build --filter="...[deployed]" --dry-run=json',
                { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }
              );
              const data = JSON.parse(out);
              affected = data.packages || [];
            } catch {
              // If turbo fails, deploy every convention-deployable site.
              affected = fs.readdirSync('apps').filter(isDeployable);
            }

            core.info(`Affected packages: ${JSON.stringify(affected)}`);

            const deployable = affected
              .filter(isDeployable)
              .map(pkg => {
                const dir = `apps/${pkg}`;
                const toml = fs.readFileSync(`${dir}/wrangler.toml`, 'utf8');
                const authMatch = toml.match(/BETTER_AUTH_URL\s*=\s*"([^"]+)"/);
                return { name: pkg, dir, auth: authMatch ? authMatch[1] : '' };
              });

            // Deploy only the affected sites; skip deployment when none are affected.
            const result = deployable;

            core.info(`Deploying: ${JSON.stringify(result)}`);
            core.setOutput('sites', JSON.stringify(result));

  build-and-deploy:
    needs: [migrate, detect]
    if: ${{ needs.detect.outputs.sites != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: ${{ fromJson(needs.detect.outputs.sites) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile

      - name: Write env files
        run: |
          printf 'NODE_ENV=production\nBETTER_AUTH_SECRET=%s\nBETTER_AUTH_URL=%s\nASSET_BASE_URL=https://asset.tcg.cards\n' \
            "$BETTER_AUTH_SECRET" "$AUTH_URL" \
            > ${{ matrix.site.dir }}/.env.production
          printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET" \
            > ${{ matrix.site.dir }}/secrets.env
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          AUTH_URL: ${{ matrix.site.auth }}

      - name: Build
        working-directory: ${{ matrix.site.dir }}
        run: bun run build

      - name: Deploy
        working-directory: ${{ matrix.site.dir }}
        run: bunx wrangler deploy --secrets-file secrets.env
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  tag:
    needs: [build-and-deploy]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update deployed tag
        run: |
          git tag -f deployed
          git push origin deployed -f
