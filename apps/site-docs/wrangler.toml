name = "docs-tcg-cards"
main = "./.output/server/index.mjs"
compatibility_date = "2026-02-19"
compatibility_flags = ["nodejs_compat"]

workers_dev = false

# Opted out of the shared deploy pipeline.
deploy = false

[[routes]]
pattern = "docs.tcg.cards"
custom_domain = true

[observability]
enabled = true

[assets]
binding = "ASSETS"
directory = "./.output/public/"
